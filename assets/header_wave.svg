<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glitchAnim1 {
        0%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); opacity: 0.95; }
        2% { transform: translate(-3px, 1px); clip-path: inset(10% 0 75% 0); }
        4% { transform: translate(3px, -1px); clip-path: inset(65% 0 15% 0); }
        6% { transform: translate(-2px, 0); clip-path: inset(30% 0 50% 0); }
        8% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
        45% { transform: translate(0, 0); }
        47% { transform: translate(-4px, 2px); clip-path: inset(20% 0 60% 0); }
        49% { transform: translate(4px, -2px); clip-path: inset(70% 0 5% 0); }
        51% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
      }

      @keyframes glitchAnim2 {
        0%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); opacity: 0.85; }
        3% { transform: translate(3px, -2px); clip-path: inset(40% 0 40% 0); }
        5% { transform: translate(-3px, 2px); clip-path: inset(15% 0 65% 0); }
        7% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
        46% { transform: translate(3px, -1px); clip-path: inset(55% 0 25% 0); }
        48% { transform: translate(-3px, 1px); clip-path: inset(5% 0 80% 0); }
        50% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
      }

      @keyframes scanlineAnim {
        0% { transform: translateY(-50px); }
        100% { transform: translateY(350px); }
      }

      @keyframes pulseBadge {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00F0FF); }
        50% { opacity: 0.3; filter: drop-shadow(0 0 1px #00F0FF); }
      }

      @keyframes wave1 {
        0% { d: path("M0 275 Q 300 240 600 275 T 1200 275 L 1200 340 L 0 340 Z"); }
        50% { d: path("M0 275 Q 300 305 600 265 T 1200 275 L 1200 340 L 0 340 Z"); }
        100% { d: path("M0 275 Q 300 240 600 275 T 1200 275 L 1200 340 L 0 340 Z"); }
      }

      @keyframes wave2 {
        0% { d: path("M0 295 Q 350 265 700 295 T 1200 295 L 1200 340 L 0 340 Z"); }
        50% { d: path("M0 295 Q 350 320 700 280 T 1200 295 L 1200 340 L 0 340 Z"); }
        100% { d: path("M0 295 Q 350 265 700 295 T 1200 295 L 1200 340 L 0 340 Z"); }
      }

      .glitch-layer-cyan {
        animation: glitchAnim1 3.5s infinite linear alternate-reverse;
      }
      .glitch-layer-magenta {
        animation: glitchAnim2 2.8s infinite linear alternate-reverse;
      }
      .scanline {
        animation: scanlineAnim 4s infinite linear;
      }
      .live-dot {
        animation: pulseBadge 1.6s infinite ease-in-out;
      }
      .wave-aurora-1 {
        animation: wave1 7s infinite ease-in-out;
      }
      .wave-aurora-2 {
        animation: wave2 9s infinite ease-in-out;
      }
    </style>

    <!-- Deep Obsidian Studio Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Metallic Cyan & Violet Dynamic Gradients -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#00F0FF" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Ambient Glow Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="75" />
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="85" />
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs with Pulsing Glow -->
  <circle cx="180" cy="90" r="150" fill="#0284c7" opacity="0.35" filter="url(#glowCyan)">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="190" r="170" fill="#7c3aed" opacity="0.3" filter="url(#glowPurple)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Sweeping Holographic Scanline -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" class="scanline" />

  <!-- Top Laser Boundary Line -->
  <line x1="80" y1="42" x2="1120" y2="42" stroke="url(#laserLine)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <line x1="80" y1="298" x2="1120" y2="298" stroke="url(#laserLine)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Top Status Badge -->
  <g transform="translate(600, 72)">
    <rect x="-215" y="-15" width="430" height="30" rx="15" fill="#0f172a" stroke="rgba(0, 240, 255, 0.55)" stroke-width="1.2" />
    <circle cx="-193" cy="0" r="4.5" fill="#00F0FF" class="live-dot" />
    <text x="-175" y="5" fill="#00F0FF" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="11.5" font-weight="700" letter-spacing="1.8">SOVEREIGN AI • MULTI-AGENT CLUSTERS • CLOUD ARCHITECT</text>
  </g>

  <!-- HIGH-IMPACT CYBERPUNK GLITCH NAME -->
  <g transform="translate(600, 160)">
    <!-- Cyan Glitch Layer (Offset Left) -->
    <text class="glitch-layer-cyan" x="0" y="0" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-weight="900" font-size="47" letter-spacing="4">
      DANIANDRA PRAYUDISTY ILHAM
    </text>

    <!-- Magenta Glitch Layer (Offset Right) -->
    <text class="glitch-layer-magenta" x="0" y="0" text-anchor="middle" fill="#FF007A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-weight="900" font-size="47" letter-spacing="4">
      DANIANDRA PRAYUDISTY ILHAM
    </text>

    <!-- Crisp Centerplate White Text -->
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-weight="900" font-size="47" letter-spacing="3.8">
      DANIANDRA PRAYUDISTY ILHAM
    </text>
  </g>

  <!-- Executive Title with Shimmering Gradient -->
  <text x="600" y="210" text-anchor="middle" fill="url(#glowGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif" font-weight="700" font-size="17" letter-spacing="3.2">
    FOUNDER &amp; OWNER @ YUDIAZ CREATIVE STUDIO
  </text>

  <!-- Technical Discipline Specs -->
  <text x="600" y="244" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="12.5" font-weight="500" letter-spacing="1.2">
    GOLANG • FLUTTER • DISTRIBUTED SYSTEMS • IOT TELEMETRY • OPES FULL SCHOLAR
  </text>

  <!-- Dynamic Waving Aurora Lines at Bottom -->
  <path class="wave-aurora-1" d="M0 275 Q 300 240 600 275 T 1200 275 L 1200 340 L 0 340 Z" fill="rgba(0, 240, 255, 0.12)" />
  <path class="wave-aurora-2" d="M0 295 Q 350 265 700 295 T 1200 295 L 1200 340 L 0 340 Z" fill="rgba(129, 140, 248, 0.18)" />
  <path d="M0 310 Q 400 290 800 310 T 1200 310 L 1200 340 L 0 340 Z" fill="#020617" />

  <!-- Outer Luxury Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" />
</svg>