<svg width="100%" height="auto" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glitchCyan {
        0%, 100% { transform: translate(0, 0); opacity: 0.9; }
        3% { transform: translate(-4px, 1.5px); opacity: 0.85; }
        6% { transform: translate(3px, -1px); opacity: 0.95; }
        9% { transform: translate(-2px, -1px); opacity: 0.8; }
        12% { transform: translate(0, 0); opacity: 0.9; }
        55% { transform: translate(0, 0); opacity: 0.9; }
        58% { transform: translate(-5px, 2px); opacity: 1; }
        61% { transform: translate(4px, -1.5px); opacity: 0.85; }
        64% { transform: translate(0, 0); opacity: 0.9; }
      }

      @keyframes glitchMagenta {
        0%, 100% { transform: translate(0, 0); opacity: 0.85; }
        4% { transform: translate(4px, -2px); opacity: 0.9; }
        7% { transform: translate(-3px, 1.5px); opacity: 0.8; }
        10% { transform: translate(2px, 1px); opacity: 0.95; }
        13% { transform: translate(0, 0); opacity: 0.85; }
        56% { transform: translate(0, 0); opacity: 0.85; }
        59% { transform: translate(4px, -1px); opacity: 1; }
        62% { transform: translate(-4px, 2px); opacity: 0.85; }
        65% { transform: translate(0, 0); opacity: 0.85; }
      }

      @keyframes scanlineAnim {
        0% { transform: translateY(-30px); }
        100% { transform: translateY(370px); }
      }

      @keyframes pulseLive {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00F0FF); }
        50% { opacity: 0.25; filter: drop-shadow(0 0 1px #00F0FF); }
      }

      @keyframes waveMotion1 {
        0% { d: path("M0 290 Q 300 250 600 290 T 1200 290 L 1200 360 L 0 360 Z"); }
        50% { d: path("M0 290 Q 300 325 600 275 T 1200 290 L 1200 360 L 0 360 Z"); }
        100% { d: path("M0 290 Q 300 250 600 290 T 1200 290 L 1200 360 L 0 360 Z"); }
      }

      @keyframes waveMotion2 {
        0% { d: path("M0 310 Q 350 275 700 310 T 1200 310 L 1200 360 L 0 360 Z"); }
        50% { d: path("M0 310 Q 350 335 700 290 T 1200 310 L 1200 360 L 0 360 Z"); }
        100% { d: path("M0 310 Q 350 275 700 310 T 1200 310 L 1200 360 L 0 360 Z"); }
      }

      .glitch-cyan {
        animation: glitchCyan 3.2s infinite ease-in-out;
      }
      .glitch-magenta {
        animation: glitchMagenta 2.7s infinite ease-in-out;
      }
      .radar-scanline {
        animation: scanlineAnim 4.5s infinite linear;
      }
      .live-dot {
        animation: pulseLive 1.8s infinite ease-in-out;
      }
      .wave-layer-1 {
        animation: waveMotion1 6.5s infinite ease-in-out;
      }
      .wave-layer-2 {
        animation: waveMotion2 8.5s infinite ease-in-out;
      }
    </style>

    <!-- Deep Cybernetic Obsidian Background -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Shimmering Gradient for Subtitle -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#00F0FF" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Laser Boundary Lines -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#C084FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>

    <!-- Matrix Architectural Grid -->
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Ambient Glow Light Filters -->
    <filter id="blurCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="blurPurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- 1. Background Baseplate -->
  <rect width="1200" height="360" rx="16" fill="url(#bgCanvas)" />
  <rect width="1200" height="360" rx="16" fill="url(#matrixGrid)" />

  <!-- 2. Ambient Light Atmosphere -->
  <circle cx="200" cy="90" r="140" fill="#0284C7" opacity="0.35" filter="url(#blurCyan)">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="190" r="160" fill="#7C3AED" opacity="0.3" filter="url(#blurPurple)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- 3. Dynamic Laser Scanline -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(0, 240, 255, 0.25)" stroke-width="2" class="radar-scanline" />

  <!-- 4. Framing Border Lines -->
  <line x1="80" y1="44" x2="1120" y2="44" stroke="url(#laserGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <line x1="80" y1="316" x2="1120" y2="316" stroke="url(#laserGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- 5. Top Cyberpunk HUD Pill -->
  <g transform="translate(600, 75)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#0F172A" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.2" />
    <circle cx="-216" cy="0" r="5" fill="#00F0FF" class="live-dot" />
    <text x="-196" y="5.5" fill="#00F0FF" font-family="system-ui, -apple-system, 'Segoe UI', monospace" font-size="12.5" font-weight="700" letter-spacing="2">SOVEREIGN AI • MULTI-AGENT CLUSTERS • CLOUD ARCHITECT</text>
  </g>

  <!-- 6. HIGH-IMPACT RGB GLITCH TYPOGRAPHY -->
  <g transform="translate(600, 168)">
    <!-- Cyan Glitch Shadow (Offset Left) -->
    <text class="glitch-cyan" x="0" y="0" text-anchor="middle" fill="#00F0FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="4">
      DANIANDRA PRAYUDISTY ILHAM
    </text>

    <!-- Magenta Glitch Shadow (Offset Right) -->
    <text class="glitch-magenta" x="0" y="0" text-anchor="middle" fill="#FF007A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="4">
      DANIANDRA PRAYUDISTY ILHAM
    </text>

    <!-- Crisp Centerplate White Typography -->
    <text x="0" y="0" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="3.8">
      DANIANDRA PRAYUDISTY ILHAM
    </text>
  </g>

  <!-- 7. Executive Subtitle with Gradient Shimmer -->
  <text x="600" y="224" text-anchor="middle" fill="url(#shimmerGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18.5" letter-spacing="3.5">
    FOUNDER &amp; OWNER @ YUDIAZ CREATIVE STUDIO
  </text>

  <!-- 8. Technical Stack Baseline -->
  <text x="600" y="260" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', monospace" font-size="13.5" font-weight="600" letter-spacing="1.8">
    GOLANG • FLUTTER • DISTRIBUTED SYSTEMS • IOT TELEMETRY • OPES FULL SCHOLAR
  </text>

  <!-- 9. Waving Aurora Fluid Horizons -->
  <path class="wave-layer-1" d="M0 290 Q 300 250 600 290 T 1200 290 L 1200 360 L 0 360 Z" fill="rgba(0, 240, 255, 0.15)" />
  <path class="wave-layer-2" d="M0 310 Q 350 275 700 310 T 1200 310 L 1200 360 L 0 360 Z" fill="rgba(129, 140, 248, 0.22)" />
  <path d="M0 328 Q 400 305 800 328 T 1200 328 L 1200 360 L 0 360 Z" fill="#020617" />

  <!-- 10. Outer Cyberpunk Luxury Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2" />
</svg>
