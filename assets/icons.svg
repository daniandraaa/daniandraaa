<!-- Project Icons with Animations -->

<!-- CSC Icon -->
<svg id="csc-icon" width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
      .rotate { animation: rotate-slow 8s linear infinite; transform-origin: 30px 30px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <circle cx="30" cy="30" r="28" fill="none" stroke="#3B82F6" stroke-width="2" class="rotate" opacity="0.3"/>
  <circle cx="30" cy="30" r="24" fill="none" stroke="#3B82F6" stroke-width="1.5" class="pulse"/>
  <path d="M 20 30 Q 30 20 40 30 Q 30 40 20 30" fill="#3B82F6" opacity="0.8"/>
  <text x="30" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#3B82F6">🏛</text>
</svg>

<!-- YouTube Icon -->
<svg id="youtube-icon" width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes play-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      .play { animation: play-pulse 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="8" y="12" width="44" height="36" rx="4" fill="#EF4444" opacity="0.2" stroke="#EF4444" stroke-width="2"/>
  <polygon points="24,20 24,40 40,30" fill="#EF4444" class="play"/>
  <circle cx="30" cy="30" r="26" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.3"/>
</svg>

<!-- AI Agents Icon -->
<svg id="agents-icon" width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .orbit { animation: orbit 6s linear infinite; transform-origin: 30px 30px; }
    </style>
  </defs>
  <circle cx="30" cy="30" r="8" fill="#8B5CF6"/>
  <g class="orbit">
    <circle cx="30" cy="12" r="4" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="44" cy="30" r="4" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="30" cy="48" r="4" fill="#8B5CF6" opacity="0.7"/>
    <circle cx="16" cy="30" r="4" fill="#8B5CF6" opacity="0.7"/>
  </g>
  <circle cx="30" cy="30" r="24" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
</svg>

<!-- Analytics Icon -->
<svg id="analytics-icon" width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes bar-rise { 0%, 100% { height: 10px; } 50% { height: 30px; } }
      @keyframes bar-rise-2 { 0%, 100% { height: 15px; } 50% { height: 35px; } }
      @keyframes bar-rise-3 { 0%, 100% { height: 20px; } 50% { height: 32px; } }
      .bar1 { animation: bar-rise 1.5s ease-in-out infinite; }
      .bar2 { animation: bar-rise-2 1.5s ease-in-out infinite 0.2s; }
      .bar3 { animation: bar-rise-3 1.5s ease-in-out infinite 0.4s; }
    </style>
  </defs>
  <rect x="14" y="35" width="8" height="15" fill="#10B981" class="bar1" transform-origin="19 35"/>
  <rect x="26" y="30" width="8" height="20" fill="#10B981" class="bar2" transform-origin="31 30"/>
  <rect x="38" y="25" width="8" height="25" fill="#10B981" class="bar3" transform-origin="43 25"/>
  <path d="M 12 45 Q 24 15 48 5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.5"/>
</svg>

